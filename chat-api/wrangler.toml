name = "arber-gordon-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Adres strony, która może korzystać z czatu (CORS). Kilka adresów oddziel przecinkami.
ALLOWED_ORIGINS = "https://arber-gordon.pl,https://www.arber-gordon.pl"

# Opcjonalnie (płatnie) — Claude zamiast Workers AI. Klucz ustaw jako sekret:
#   npx wrangler secret put ANTHROPIC_API_KEY

# Darmowe Cloudflare Workers AI (limit dzienny w planie Free).
[ai]
binding = "AI"
